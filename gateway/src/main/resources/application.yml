server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/user/**, /user/api-docs/** # swagger
            - id: main-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/main/**, /main/api-docs/** # swagger
            - id: worker-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/worker/**
