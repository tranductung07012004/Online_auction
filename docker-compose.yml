  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root
    volumes:
      - ./logs_from_docker/user:/var/log/app/user:ro
      - ./logs_from_docker/main:/var/log/app/main:ro
      - ./logs_from_docker/worker:/var/log/app/worker:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - backend
    # depends_on:
    #   elasticsearch:
    #     condition: service_healthy
    command: filebeat -e -strict.perms=false

networks:
  backend:
    driver: bridge

volumes:
  elasticsearch_data:
  db1_data:
  db2_data:
  kafka_data:
  filebeat_data:
