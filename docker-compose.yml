services:
  # Database 1: User Service (Authentication & User Management)
  db1:
    image: postgres:15-alpine
    container_name: db1
    restart: unless-stopped
    environment:
      POSTGRES_DB: db1
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - db1_data:/var/lib/postgresql/data
      - ./db1_script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Database 2: Product Service (Products, Orders, Bids, etc.)
  db2:
    image: postgres:15-alpine
    container_name: db2
    restart: unless-stopped
    environment:
      POSTGRES_DB: db2
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - db2_data:/var/lib/postgresql/data
      - ./db2_script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db1_data:
  db2_data:
